name: Deploy study site to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "answers/**/*.md"
      - "INTERVIEW_QUESTIONS_AGENT_HARNESS_EXPANDED.md"
      - "ENGINEERING_FOUNDATIONS_PATCH.md"
      - "site/**"
      - "scripts/build_site.py"
      - "scripts/build_index.py"
      - "requirements-site.txt"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-site.txt

      - name: Install site builder
        run: pip install -r requirements-site.txt

      - name: Build static study site
        run: python3 scripts/build_site.py --output _site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
